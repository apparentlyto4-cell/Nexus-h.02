name: Build NEXUS._H Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEXUS_H_Project_FIXED.zip
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "NEXUS_H_Project_FIXED.zip" ]; then
            echo "::error::NEXUS_H_Project_FIXED.zip was not found in the repository root. Upload it to the root of the repo (do not extract it) and run again."
            echo "ZIP files currently in the repo root:"; ls -1 ./*.zip 2>/dev/null || echo "(none)"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/nexus_src"
          mkdir -p "$RUNNER_TEMP/nexus_src"
          unzip -q "NEXUS_H_Project_FIXED.zip" -d "$RUNNER_TEMP/nexus_src"
          echo "Extracted. Top-level contents:"
          ls -la "$RUNNER_TEMP/nexus_src"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          ANCHOR=$(find "$RUNNER_TEMP/nexus_src" -maxdepth 4 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)
          if [ -z "$ANCHOR" ]; then
            echo "::error::No settings.gradle(.kts) found inside NEXUS_H_Project_FIXED.zip."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$ANCHOR")
          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Project root $PROJECT_DIR has no app/src/main/AndroidManifest.xml."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project folder: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.7 (fallback when no wrapper jar is included)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Show build error summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build error summary"
            echo '```'
            grep -n -B2 -A25 "What went wrong" build.log | head -80 || true
            echo "--- lines mentioning errors ---"
            grep -n -E "^e: |error:|Execution failed|FAILED|Could not|ERROR" build.log | head -40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare NEXUS_H.apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK was not created at $APK"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp "$APK" "$GITHUB_WORKSPACE/apk_out/NEXUS_H.apk"
          ls -la "$GITHUB_WORKSPACE/apk_out"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_H-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS_H-APK
          path: apk_out/NEXUS_H.apk
          if-no-files-found: error
